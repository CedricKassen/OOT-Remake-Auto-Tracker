name: Release

# Pushing a tag like v1.2.0 builds the server (command line and tray app)
# and the tracker app for every platform, and publishes them as a GitHub
# release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.50.1
  # What the Flutter Linux builds need; the tray icon needs the appindicator
  # library, and patchelf is used to ship that library with the server app.
  LINUX_PACKAGES: clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev patchelf file

defaults:
  run:
    shell: bash

jobs:
  # The command-line server, `ootd`.
  server:
    name: ootd (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test
        run: |
          (cd packages/oot_save && dart test)
          (cd packages/oot_tracker && dart test)
          (cd server && dart test)
      - name: Build
        run: |
          out="ootd-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$out/data"
          exe=ootd
          if [ "$RUNNER_OS" = Windows ]; then exe=ootd.exe; fi
          dart compile exe server/bin/ootd.dart -o "dist/$out/$exe"
          # The checklist data the server reads at start; it looks for a
          # `data` folder next to the executable.
          cp data/*.json "dist/$out/data/"
          cp README.md NOTICE "dist/$out/"
          if [ "$RUNNER_OS" = macOS ]; then cp server/install-launchd.sh "dist/$out/"; fi
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && 7z a -tzip "$out.zip" "$out")
          else
            tar -C dist -czf "dist/$out.tar.gz" "$out"
          fi
          rm -r "dist/$out"
      - uses: actions/upload-artifact@v4
        with:
          name: ootd-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # The desktop builds of the tracker app (`app`) and of the server's tray
  # app (`host`).
  desktop:
    name: ${{ matrix.title }} (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is pinned to the 2022 image: it has Visual Studio 2022, the
        # newest that this Flutter version can find. Newer images ship a
        # newer Visual Studio and the build fails with "could not find any
        # instance of Visual Studio".
        include:
          - { project: app, title: App, file: OoT-Tracker, product: 'OoT Tracker', os: macos-latest, name: macos-universal }
          - { project: app, title: App, file: OoT-Tracker, product: 'OoT Tracker', os: windows-2022, name: windows-x64 }
          - { project: app, title: App, file: OoT-Tracker, product: 'OoT Tracker', os: ubuntu-latest, name: linux-x64 }
          - { project: host, title: Server app, file: OoT-Tracker-Server, product: 'OoT Tracker Server', os: macos-latest, name: macos-universal }
          - { project: host, title: Server app, file: OoT-Tracker-Server, product: 'OoT Tracker Server', os: windows-2022, name: windows-x64 }
          - { project: host, title: Server app, file: OoT-Tracker-Server, product: 'OoT Tracker Server', os: ubuntu-latest, name: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Bundle the checklist data
        if: matrix.project == 'host'
        working-directory: host
        run: dart run tool/sync_data.dart
      - name: Test
        # Once is enough: the tests do not depend on the platform.
        if: runner.os == 'macOS'
        working-directory: ${{ matrix.project }}
        run: flutter test
      - name: Build
        working-directory: ${{ matrix.project }}
        run: |
          out="${{ matrix.file }}-${GITHUB_REF_NAME}-${{ matrix.name }}"
          version=(--build-name "${GITHUB_REF_NAME#v}" --build-number "${GITHUB_RUN_NUMBER}")
          mkdir -p ../dist
          case "$RUNNER_OS" in
            macOS)
              flutter build macos --release "${version[@]}"
              # ditto keeps the bundle's symlinks and signature intact.
              ditto -c -k --sequesterRsrc --keepParent \
                "build/macos/Build/Products/Release/${{ matrix.product }}.app" "../dist/$out.zip"
              ;;
            Windows)
              flutter build windows --release "${version[@]}"
              mv build/windows/x64/runner/Release "../dist/$out"
              (cd ../dist && 7z a -tzip "$out.zip" "$out" && rm -r "$out")
              ;;
            Linux)
              flutter build linux --release "${version[@]}"
              mv build/linux/x64/release/bundle "../dist/$out"
              if [ "${{ matrix.project }}" = host ]; then
                # Ship the tray-icon libraries with the app: many systems do
                # not have them installed, and without them it does not
                # start. Each copy looks for the others next to itself, and so
                # does the plugin that needs them: a library is only searched
                # for where the one asking for it says, and the plugin is
                # built without such a place (the app's own does not count).
                lib="$(realpath "../dist/$out/lib")"
                plugin="$lib/libtray_manager_plugin.so"
                ldd "$plugin" | awk '/ayatana|dbusmenu/ { print $3 }' | while read -r so; do
                  cp -L "$so" "$lib/"
                  patchelf --set-rpath '$ORIGIN' "$lib/$(basename "$so")"
                done
                patchelf --set-rpath '$ORIGIN' "$plugin"
                # The plugin has to find the copy in the bundle, not the one
                # installed on this build machine.
                ldd "$plugin" | grep libayatana-appindicator3 | grep -qF "$lib/" \
                  || { echo "::error::the tray plugin does not use the bundled libraries"; ldd "$plugin"; exit 1; }
              fi
              (cd ../dist && tar -czf "$out.tar.gz" "$out")
              # The same build once more as a single file that runs anywhere.
              curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
                https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x "$RUNNER_TEMP/appimagetool"
              APPIMAGETOOL="$RUNNER_TEMP/appimagetool" ../tools/appimage/make.sh \
                "../dist/$out" "oot_tracker_${{ matrix.project }}" "${{ matrix.product }}" "../dist/$out.AppImage"
              rm -r "../dist/$out"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  android-app:
    name: App (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Set up release signing
        # Optional: without these secrets the APK is signed with a debug key
        # that differs on every run, so it cannot update an installed copy.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing the APK with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > app/android/key.properties
      - name: Build
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name "${GITHUB_REF_NAME#v}" --build-number "${GITHUB_RUN_NUMBER}"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../dist/OoT-Tracker-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: dist/*.apk
          if-no-files-found: error

  ios-app:
    name: App (ios, unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: app
        run: |
          # Apple only lets signed apps run on a device, and signing needs a
          # paid developer account. This builds the app without a signature;
          # whoever installs it signs it with their own Apple ID.
          flutter build ios --release --no-codesign \
            --build-name "${GITHUB_REF_NAME#v}" --build-number "${GITHUB_RUN_NUMBER}"
          mkdir -p ../dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "../dist/OoT-Tracker-${GITHUB_REF_NAME}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: Publish release
    needs: [server, desktop, android-app, ios-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
