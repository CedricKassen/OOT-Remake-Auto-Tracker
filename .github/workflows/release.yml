name: Release

# Pushing a tag like v1.2.0 builds the server and both apps and publishes
# them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.38.1

jobs:
  server:
    name: Server (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-latest, name: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test
        run: |
          (cd packages/oot_save && dart test)
          (cd packages/oot_tracker && dart test)
      - name: Build
        run: |
          out="ootd-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "dist/$out"
          dart compile exe server/bin/ootd.dart -o "dist/$out/ootd"
          # The checklist data the server reads at start; it looks for a
          # `data` folder next to the executable.
          mkdir "dist/$out/data"
          cp data/*.json "dist/$out/data/"
          cp server/install-launchd.sh README.md NOTICE "dist/$out/"
          tar -C dist -czf "dist/$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test
        run: flutter test
        working-directory: app
      - name: Build
        working-directory: app
        run: |
          flutter build macos --release \
            --build-name "${GITHUB_REF_NAME#v}" --build-number "${GITHUB_RUN_NUMBER}"
          mkdir -p ../dist
          # ditto keeps the bundle's symlinks and signature intact.
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/OoT Tracker.app" \
            "../dist/OoT-Tracker-${GITHUB_REF_NAME}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: dist/*.zip
          if-no-files-found: error

  android-app:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Use the runner's JDK
        # gradle.properties may pin a JDK path of the developer's machine.
        run: sed -i '/^org\.gradle\.java\.home=/d' app/android/gradle.properties
      - name: Set up release signing
        # Optional: without these secrets the APK is signed with a debug key
        # that differs on every run, so it cannot update an installed copy.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing the APK with a throwaway debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > app/android/key.properties
      - name: Build
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name "${GITHUB_REF_NAME#v}" --build-number "${GITHUB_RUN_NUMBER}"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../dist/OoT-Tracker-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [server, macos-app, android-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
